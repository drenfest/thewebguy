<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc"><title id="title">Illustrative guardrails around one source of truth</title><desc id="desc">One canonical source feeds three pages. A validation layer checks unique records, followed by human review for context.</desc>
<rect width="560" height="440" rx="20" fill="#111f27"/><g font-family="Arial,sans-serif"><text x="30" y="40" fill="#9dc0b4" font-size="13" letter-spacing="2">ILLUSTRATIVE DATA GUARDRAIL</text>
<rect x="139" y="72" width="282" height="68" rx="10" fill="#1c4136" stroke="#46d6a6" stroke-width="2"/><text x="280" y="102" text-anchor="middle" fill="#eaf9f2" font-size="21">One source of truth</text><text x="280" y="123" text-anchor="middle" fill="#a2cfbf" font-size="14">Canonical service data</text>
<path d="M280 141V181M88 181H472M88 181V206M280 181V206M472 181V206" stroke="#4ed3a7" stroke-width="2" fill="none"/>
<g fill="#1c303d" stroke="#58717c"><rect x="26" y="206" width="124" height="61" rx="7"/><rect x="218" y="206" width="124" height="61" rx="7"/><rect x="410" y="206" width="124" height="61" rx="7"/></g><g fill="#e4edf1" font-size="19" text-anchor="middle"><text x="88" y="244">Page A</text><text x="280" y="244">Page B</text><text x="472" y="244">Page C</text></g>
<rect x="26" y="299" width="508" height="105" rx="10" fill="#0b1620" stroke="#4b6a67" stroke-dasharray="6 5"/><circle cx="54" cy="327" r="7" fill="#30c795"/><text x="74" y="333" fill="#d8eee6" font-size="17">Validation catches duplicate records</text><circle cx="54" cy="370" r="7" fill="#efbd73"/><text x="74" y="376" fill="#ede5d6" font-size="17">Human review checks the context</text></g></svg>
