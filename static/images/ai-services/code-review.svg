<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
<title id="title">An illustrative code review follows a changed route beyond the diff</title><desc id="desc">A renamed route is connected to redirects, navigation, a sitemap and a review comment asking what happens to the old URL.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142a30"/><stop offset="1" stop-color="#101925"/></linearGradient></defs>
<rect width="560" height="440" rx="20" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="30" y="40" fill="#8db3ab" font-size="13" letter-spacing="2">ILLUSTRATIVE REVIEW / ROUTE CHANGE</text>
<rect x="26" y="66" width="508" height="198" rx="10" fill="#0b1420" stroke="#365158"/><circle cx="48" cy="87" r="4" fill="#ffb76d"/><circle cx="64" cy="87" r="4" fill="#30c795"/><text x="86" y="92" fill="#c4d4d5" font-size="14">routes / service.js</text>
<path d="M26 106H534" stroke="#365158"/><rect x="40" y="124" width="480" height="42" rx="3" fill="#422c2e"/><rect x="40" y="172" width="480" height="42" rx="3" fill="#163b32"/>
<g font-family="monospace" font-size="17"><text x="54" y="151" fill="#ffc4b5">− path: '/old-service/'</text><text x="54" y="200" fill="#87ebc8">+ path: '/new-service/'</text></g>
<text x="48" y="243" fill="#a3b8c4" font-size="14">The diff is the starting point.</text>
<path d="M118 264V285H434V307M280 264V307M118 285V307" fill="none" stroke="#30c795" stroke-width="2"/>
<g fill="#1b3339" stroke="#47796d"><rect x="36" y="307" width="164" height="42" rx="6"/><rect x="218" y="307" width="124" height="42" rx="6"/><rect x="360" y="307" width="164" height="42" rx="6"/></g>
<g fill="#f5f5ef" font-size="16" text-anchor="middle"><text x="118" y="333">Redirects</text><text x="280" y="333">Navigation</text><text x="442" y="333">Sitemap</text></g>
<circle cx="42" cy="390" r="10" fill="#efbd73"/><text x="64" y="396" fill="#f4e8d7" font-size="17">What happens to the old URL?</text></g></svg>
