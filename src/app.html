<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b111a" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="The Web Guy" />
    <meta name="apple-mobile-web-app-title" content="The Web Guy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="alternate" href="/llms.txt" type="text/markdown" title="LLM overview for The Web Guy" />
    <link rel="alternate" href="/llms-full.txt" type="text/markdown" title="Full LLM context for The Web Guy" />
    <link
      rel="preload"
      href="/images/technical-web-support-hero-960.webp"
      as="image"
      type="image/webp"
      imagesrcset="/images/technical-web-support-hero-640.webp 640w, /images/technical-web-support-hero-960.webp 960w, /images/technical-web-support-hero-1280.webp 1280w"
      imagesizes="(min-width: 1024px) 430px, (min-width: 720px) 74vw, 92vw"
      fetchpriority="high"
    />
    <link rel="preload" href="/fonts/inter-latin-400-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin-600-700.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
