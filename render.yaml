services:
  - type: web
    name: thewebguy-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run verify:contact-email && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_SITE_URL
        value: https://thewebguy.app
      - key: PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: PUBLIC_TAWK_ENABLED
        value: true
      - key: PUBLIC_TAWK_PROPERTY_ID
        value: 6a43edcd82c4e81d44ac79af
      - key: PUBLIC_TAWK_WIDGET_ID
        value: 1jsclhqsd
      - key: PUBLIC_TAWK_HIDE_WHEN_OFFLINE
        value: true
      - key: PUBLIC_TAWK_ALLOWED_HOSTS
        value: thewebguy.app,www.thewebguy.app
      - key: CONTACT_EMAIL_PROVIDER
        value: gmail
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER_ID
        value: me
      - key: CONTACT_OAUTH_SETUP_KEY
        sync: false
      - key: GMAIL_REDIRECT_URI
        value: https://thewebguy.app/api/admin/gmail-oauth/callback
      - key: RENDER_API_KEY
        sync: false
      - key: CONTACT_OAUTH_TRIGGER_DEPLOY
        value: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
