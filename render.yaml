services:
  - type: web
    name: thewebguy-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node build
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_SITE_URL
        value: https://thewebguy.app
      - key: PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
